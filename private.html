<!-- ========================= --><!-- FILE NAME: private.html --><!-- COMPLETE FIREBASE CHAT --><!-- ========================= --><!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ultimate Private Chat</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
height:100vh;
overflow:hidden;
}

/* LOGIN */

.login-screen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#020617;
z-index:999;
}

.login-card{
width:100%;
max-width:420px;
background:#0f172a;
padding:35px;
border-radius:24px;
border:1px solid #334155;
text-align:center;
}

.login-card h1{
margin-bottom:15px;
font-size:32px;
}

.google-btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

/* APP */

.app{
display:none;
height:100vh;
grid-template-columns:320px 1fr;
}

/* SIDEBAR */

.sidebar{
background:#0f172a;
border-right:1px solid #1e293b;
display:flex;
flex-direction:column;
}

.profile{
padding:25px;
text-align:center;
border-bottom:1px solid #1e293b;
}

.profile img{
width:90px;
height:90px;
border-radius:50%;
margin-bottom:10px;
border:4px solid #2563eb;
}

.profile h2{
margin-bottom:5px;
}

.profile small{
color:#94a3b8;
word-break:break-word;
}

.menu{
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.menu button{
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
cursor:pointer;
}

/* CHAT AREA */

.chat-area{
display:flex;
flex-direction:column;
height:100vh;
}

.topbar{
padding:18px;
background:#0f172a;
border-bottom:1px solid #1e293b;
}

.room-box{
display:flex;
gap:10px;
}

.room-box input{
flex:1;
padding:15px;
border:none;
border-radius:14px;
background:#1e293b;
color:white;
outline:none;
}

.room-box button{
padding:15px 18px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
cursor:pointer;
}

.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
background:#020617;
}

.empty{
text-align:center;
margin-top:80px;
color:#64748b;
}

.msg-row{
display:flex;
margin-bottom:15px;
}

.mine{
justify-content:flex-end;
}

.message{
max-width:78%;
background:#1e293b;
padding:15px;
border-radius:20px;
}

.mine .message{
background:#1d4ed8;
}

.msg-top{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.msg-top img{
width:42px;
height:42px;
border-radius:50%;
}

.msg-text{
white-space:pre-wrap;
line-height:1.6;
}

.time{
display:block;
margin-top:10px;
font-size:12px;
opacity:.8;
}

.actions{
margin-top:10px;
display:flex;
gap:8px;
}

.actions button{
padding:8px 10px;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
font-size:12px;
}

.delete-btn{
background:#dc2626;
}

.edit-btn{
background:#f59e0b;
}

/* BOTTOM */

.bottom{
padding:18px;
background:#0f172a;
border-top:1px solid #1e293b;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.bottom input{
flex:1;
padding:15px;
border:none;
border-radius:14px;
background:#1e293b;
color:white;
outline:none;
}

.bottom button{
padding:15px 18px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
cursor:pointer;
}

.recording{
background:#dc2626 !important;
}

/* ADMIN */

.admin-panel{
position:fixed;
top:20px;
right:20px;
width:320px;
background:#0f172a;
border:1px solid #334155;
border-radius:20px;
padding:20px;
display:none;
z-index:100;
}

.admin-panel textarea{
width:100%;
height:120px;
background:#1e293b;
border:none;
border-radius:14px;
padding:14px;
color:white;
margin-bottom:10px;
resize:none;
}

.admin-panel button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
margin-top:10px;
cursor:pointer;
}

@media(max-width:900px){

.app{
grid-template-columns:1fr;
}

.sidebar{
display:none;
}

.message{
max-width:94%;
}

}

</style></head><body><!-- LOGIN --><div class="login-screen" id="loginScreen"><div class="login-card"><h1>Private Gmail Chat</h1><p>
Realtime private Firebase chat
with admin panel.
</p><button class="google-btn" id="loginBtn">
Login With Google
</button></div></div><!-- ADMIN PANEL --><div class="admin-panel" id="adminPanel"><h2>Admin Panel</h2><textarea
id="announcementInput"
placeholder="Write announcement..."
></textarea><button id="announcementBtn">
Post Announcement
</button><button id="clearBtn">
Delete All Messages
</button></div><!-- APP --><div class="app" id="app"><!-- SIDEBAR --><div class="sidebar"><div class="profile"><img id="myPhoto"><h2 id="myName">
User
</h2><small id="myEmail">
user@gmail.com
</small></div><div class="menu"><button onclick="toggleAdminPanel()">
Admin Panel
</button><button onclick="logoutUser()">
Logout
</button></div></div><!-- CHAT --><div class="chat-area"><div class="topbar"><div class="room-box"><input
type="email"
id="otherEmail"
placeholder="Enter other Gmail"
/>

<button id="openRoomBtn">
Open Private
</button></div></div><div class="chat-box" id="chatBox"><div class="empty">
Open private chat first
</div></div><div class="bottom"><input
type="text"
id="messageInput"
placeholder="Write message..."

«»

<button id="recordBtn">
🎤
</button><button id="sendBtn">
Send
</button></div></div></div><script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
deleteDoc,
doc,
updateDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyDpERmy9jWQ5IS5GmyP54EZNdYDiKB-3RI",

authDomain:
"wadi-soon-site.firebaseapp.com",

projectId:
"wadi-soon-site",

storageBucket:
"wadi-soon-site.firebasestorage.app",

messagingSenderId:
"306902521128",

appId:
"1:306902521128:web:13b34b479048240b96ec1d"

};

const ADMIN_EMAIL =
"mshahidiqbal836@gmail.com";

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const provider =
new GoogleAuthProvider();

const loginScreen =
document.getElementById("loginScreen");

const appBox =
document.getElementById("app");

const loginBtn =
document.getElementById("loginBtn");

const myPhoto =
document.getElementById("myPhoto");

const myName =
document.getElementById("myName");

const myEmail =
document.getElementById("myEmail");

const otherEmail =
document.getElementById("otherEmail");

const openRoomBtn =
document.getElementById("openRoomBtn");

const chatBox =
document.getElementById("chatBox");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

let currentUser = null;
let currentRoom = null;

loginBtn.onclick = async()=>{

await signInWithPopup(
auth,
provider
);

};

onAuthStateChanged(auth,(user)=>{

if(user){

currentUser = user;

loginScreen.style.display =
"none";

appBox.style.display =
"grid";

myPhoto.src =
user.photoURL;

myName.innerText =
user.displayName;

myEmail.innerText =
user.email;

if(user.email === ADMIN_EMAIL){

document.getElementById(
"adminPanel"
).style.display = "block";

}

}else{

loginScreen.style.display =
"flex";

appBox.style.display =
"none";

}

});

window.logoutUser = async()=>{

await signOut(auth);

location.reload();

};

openRoomBtn.onclick = ()=>{

const other =
otherEmail.value.trim();

if(other === ""){

alert("Enter Gmail");

return;

}

currentRoom =
[currentUser.email,other]
.sort()
.join("_")
.replace(/[.#$[\]]/g,"_");

loadMessages();

};

async function sendMessage(){

if(!currentRoom){

alert("Open private chat first");

return;

}

const text =
messageInput.value.trim();

if(text === "") return;

await addDoc(

collection(
db,
"rooms",
currentRoom,
"messages"
),

{

text:text,

name:
currentUser.displayName,

email:
currentUser.email,

photo:
currentUser.photoURL,

time:
Date.now(),

createdAt:
serverTimestamp()

}

);

messageInput.value = "";

}

sendBtn.onclick =
sendMessage;

function loadMessages(){

const q = query(

collection(
db,
"rooms",
currentRoom,
"messages"
),

orderBy(
"time",
"asc"
)

);

onSnapshot(q,(snapshot)=>{

chatBox.innerHTML = "";

snapshot.forEach((docSnap)=>{

const data =
docSnap.data();

const mine =
data.email === currentUser.email;

chatBox.innerHTML += `

<div class="msg-row ${mine ? "mine" : ""}">

<div class="message">

<div class="msg-top">

<img src="${data.photo}">

<div>

<b>${data.name}</b><br>

<small>${data.email}</small>

</div>

</div>

<div class="msg-text">
${data.text}
</div>

<small class="time">

${new Date(
data.time
).toLocaleString()}

</small>

</div>

</div>

`;

});

chatBox.scrollTop =
chatBox.scrollHeight;

});

}

</script></body>
</html>
