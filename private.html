<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Messenger</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#081120;
color:white;
min-height:100vh;
}

.hidden{
display:none;
}

.login-screen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:#101d35;
padding:30px;
border-radius:30px;
border:1px solid rgba(255,255,255,.08);
}

.title{
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
color:#9aa9ca;
line-height:1.7;
margin-bottom:25px;
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.google-btn{
background:linear-gradient(135deg,#4f8cff,#7c5cff);
color:white;
}

.app{
padding:15px;
}

.container{
display:grid;
grid-template-columns:340px 1fr;
gap:15px;
height:calc(100vh - 30px);
}

.sidebar,
.chat-area{
background:#101d35;
border-radius:30px;
border:1px solid rgba(255,255,255,.08);
overflow:hidden;
}

.sidebar{
padding:15px;
overflow:auto;
}

.me-box{
background:#1a2850;
padding:15px;
border-radius:22px;
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.avatar{
width:65px;
height:65px;
border-radius:50%;
object-fit:cover;
}

.name{
font-size:22px;
font-weight:bold;
}

.email{
color:#9aa9ca;
margin-top:4px;
word-break:break-word;
}

.card{
background:#1a2850;
padding:20px;
border-radius:25px;
margin-bottom:20px;
}

.card h2{
margin-bottom:15px;
}

.input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:16px;
background:#081120;
color:white;
margin-bottom:15px;
}

.search-btn{
background:linear-gradient(135deg,#4f8cff,#7c5cff);
color:white;
}

.logout-btn{
background:#ff5470;
color:white;
}

.chat-list{
margin-top:20px;
}

.chat-item{
display:flex;
align-items:center;
gap:12px;
padding:12px;
border-radius:18px;
background:#1a2850;
margin-bottom:10px;
cursor:pointer;
}

.chat-item:hover{
background:#223566;
}

.chat-area{
display:flex;
flex-direction:column;
}

.chat-header{
padding:18px;
border-bottom:1px solid rgba(255,255,255,.08);
display:flex;
align-items:center;
gap:12px;
}

.messages{
flex:1;
overflow:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.message{
max-width:75%;
padding:14px;
border-radius:18px;
line-height:1.6;
}

.me{
align-self:flex-end;
background:linear-gradient(135deg,#4f8cff,#7c5cff);
}

.other{
align-self:flex-start;
background:#1a2850;
}

.composer{
padding:15px;
border-top:1px solid rgba(255,255,255,.08);
display:flex;
gap:12px;
}

.textarea{
flex:1;
height:58px;
resize:none;
padding:16px;
border:none;
outline:none;
border-radius:18px;
background:#081120;
color:white;
}

.send-btn{
width:60px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#4f8cff,#7c5cff);
color:white;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
height:auto;
}

.chat-area{
height:80vh;
}
}
</style>
</head>
<body>

<section id="loginScreen" class="login-screen">
<div class="login-box">
<div class="title">Private Messenger</div>
<div class="subtitle">
Secure private chatting with Google login.
</div>
<button id="googleBtn" class="btn google-btn">
Continue With Google
</button>
</div>
</section>

<section id="app" class="app hidden">
<div class="container">

<div class="sidebar">

<div id="meBox"></div>

<div class="card">
<h2>New Private Chat</h2>
<input id="searchInput" class="input" type="email" placeholder="example@gmail.com">
<button id="searchBtn" class="btn search-btn">Search User</button>
<div id="searchResult" style="margin-top:15px"></div>
</div>

<div class="card">
<h2>Account</h2>
<button id="logoutBtn" class="btn logout-btn">Logout</button>
</div>

<div class="chat-list" id="chatList"></div>

</div>

<div class="chat-area">

<div class="chat-header">
<img id="chatAvatar" class="avatar">
<div>
<div id="chatName" class="name">Select Chat</div>
<div id="chatEmail" class="email"></div>
</div>
</div>

<div class="messages" id="messages"></div>

<div class="composer">
<textarea id="messageInput" class="textarea" placeholder="Write message..."></textarea>
<button id="sendBtn" class="send-btn">➤</button>
</div>

</div>

</div>
</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
query,
where,
getDocs,
addDoc,
onSnapshot,
orderBy,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDpERmy9jWQ5IS5GmyP54EZNdYDiKB-3RI",
authDomain: "wadi-soon-site.firebaseapp.com",
projectId: "wadi-soon-site",
storageBucket: "wadi-soon-site.appspot.com",
messagingSenderId: "306902521128",
appId: "1:306902521128:web:13b34b479048240b96ec1d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("app");
const googleBtn = document.getElementById("googleBtn");
const meBox = document.getElementById("meBox");
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const searchResult = document.getElementById("searchResult");
const logoutBtn = document.getElementById("logoutBtn");
const chatList = document.getElementById("chatList");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const chatAvatar = document.getElementById("chatAvatar");
const chatName = document.getElementById("chatName");
const chatEmail = document.getElementById("chatEmail");

let currentUser = null;
let activeUser = null;
let activeChatId = null;

function avatar(name,photo){
if(photo) return photo;
return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4f8cff&color=fff`;
}

function chatId(a,b){
return [a,b].sort().join("_");
}

async function saveUser(user){

const fixedName = user.displayName
? user.displayName
: user.email.split("@")[0];

await setDoc(doc(db,"private_users",user.uid),{
uid:user.uid,
name:fixedName,
email:user.email,
photo:user.photoURL || "",
online:true,
updatedAt:serverTimestamp()
},{merge:true});

meBox.innerHTML = `
<div class="me-box">
<img class="avatar" src="${avatar(fixedName,user.photoURL)}">
<div>
<div class="name">${fixedName}</div>
<div class="email">${user.email}</div>
</div>
</div>
`;
}

googleBtn.onclick = async ()=>{
await signInWithPopup(auth,provider);
};

onAuthStateChanged(auth,async(user)=>{

if(user){
currentUser = user;
loginScreen.classList.add("hidden");
appScreen.classList.remove("hidden");
await saveUser(user);
loadChats();
}else{
loginScreen.classList.remove("hidden");
appScreen.classList.add("hidden");
}

});

searchBtn.onclick = async ()=>{

const email = searchInput.value.trim().toLowerCase();

if(!email){
searchResult.innerHTML = "Write Gmail";
return;
}

const q = query(collection(db,"private_users"),where("email","==",email));
const snap = await getDocs(q);

if(snap.empty){
searchResult.innerHTML = "User not found";
return;
}

const user = snap.docs[0].data();

if(user.uid === currentUser.uid){
searchResult.innerHTML = "This is your Gmail";
return;
}

searchResult.innerHTML = `
<div class="chat-item">
<img class="avatar" src="${avatar(user.name,user.photo)}">
<div style="flex:1">
<div class="name">${user.name}</div>
<div class="email">${user.email}</div>
</div>
<button id="startBtn" class="btn search-btn">Message</button>
</div>
`;

setTimeout(()=>{

document.getElementById("startBtn").onclick = ()=>{
openChat(user);
};

},100);

};

async function openChat(user){

activeUser = user;
activeChatId = chatId(currentUser.uid,user.uid);

chatAvatar.src = avatar(user.name,user.photo);
chatName.textContent = user.name;
chatEmail.textContent = user.email;

listenMessages();

}

async function sendMessage(){

const text = messageInput.value.trim();

if(!text || !activeUser) return;

await addDoc(collection(db,"private_chats",activeChatId,"messages"),{
text,
sender:currentUser.uid,
createdAt:serverTimestamp()
});

messageInput.value = "";

}

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown",(e)=>{
if(e.key === "Enter" && !e.shiftKey){
e.preventDefault();
sendMessage();
}
});

function listenMessages(){

const q = query(
collection(db,"private_chats",activeChatId,"messages"),
orderBy("createdAt","asc")
);

onSnapshot(q,(snap)=>{

messages.innerHTML = "";

snap.forEach(docSnap=>{

const data = docSnap.data();

const div = document.createElement("div");

div.className = data.sender === currentUser.uid
? "message me"
: "message other";

div.textContent = data.text;

messages.appendChild(div);

});

messages.scrollTop = messages.scrollHeight;

});

}

function loadChats(){

const q = query(collection(db,"private_users"));

onSnapshot(q,(snap)=>{

chatList.innerHTML = "";

snap.forEach(docSnap=>{

const data = docSnap.data();

if(data.uid === currentUser.uid) return;

const div = document.createElement("div");

div.className = "chat-item";

div.innerHTML = `
<img class="avatar" src="${avatar(data.name,data.photo)}">
<div>
<div class="name">${data.name}</div>
<div class="email">${data.email}</div>
</div>
`;

div.onclick = ()=> openChat(data);

chatList.appendChild(div);

});

});

}

logoutBtn.onclick = async ()=>{
await signOut(auth);
};

</script>

</body>
</html>
