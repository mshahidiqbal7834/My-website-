<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat Room</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  font-family:'Poppins',sans-serif;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.chat-container{
  width:100%;
  max-width:900px;
  background:#0f172a;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(0,0,0,0.4);
}

.chat-header{
  background:#1e293b;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.chat-header h1{
  font-size:28px;
}

.private-badge{
  background:#dc2626;
  padding:8px 16px;
  border-radius:30px;
  font-size:14px;
}

.room-box{
  padding:20px;
  background:#111827;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.room-box input{
  flex:1;
}

.chat-box{
  height:450px;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.message{
  background:#1e293b;
  padding:15px;
  border-radius:18px;
}

.message b{
  color:#60a5fa;
}

.message small{
  display:block;
  margin-top:5px;
  color:#94a3b8;
}

.chat-input{
  display:flex;
  gap:10px;
  padding:20px;
  background:#1e293b;
  flex-wrap:wrap;
}

input{
  padding:15px;
  border:none;
  border-radius:14px;
  background:#334155;
  color:white;
  font-size:15px;
}

#username,
#message{
  flex:1 1 100%;
}

button{
  padding:14px 22px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

@media(max-width:700px){

.chat-box{
  height:380px;
}

.room-box,
.chat-input{
  flex-direction:column;
}

button{
  width:100%;
}

}

</style>
</head>

<body>

<div class="chat-container">

<div class="chat-header">
  <h1>Private Chat</h1>

  <div class="private-badge">
    Private Room
  </div>
</div>

<div class="room-box">

<input type="text"
id="roomId"
placeholder="Enter Private Room ID">

<button onclick="joinRoom()">
Join Room
</button>

</div>

<div class="chat-box" id="chatBox">
</div>

<div class="chat-input">

<input type="text"
id="username"
placeholder="Your Name">

<input type="text"
id="message"
placeholder="Write private message...">

<button onclick="sendMessage()">
Send Message
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpERmy9jWQ5IS5GmyP54EZNdYDiKB-3RI",
  authDomain: "wadi-soon-site.firebaseapp.com",
  projectId: "wadi-soon-site",
  storageBucket: "wadi-soon-site.firebasestorage.app",
  messagingSenderId: "306902521128",
  appId: "1:306902521128:web:13b34b479048240b96ec1d",
  measurementId: "G-HX8J4GC9SQ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const chatBox = document.getElementById("chatBox");

let currentRoom = "";

window.joinRoom = function(){

  currentRoom = document.getElementById("roomId").value;

  if(currentRoom === ""){
    alert("Enter Room ID");
    return;
  }

  chatBox.innerHTML = "";

  onChildAdded(ref(db,"privateRooms/" + currentRoom), (snapshot) => {

    const data = snapshot.val();

    chatBox.innerHTML += `

    <div class="message">
      <b>${data.username}</b><br>
      ${data.message}
      <small>${data.time}</small>
    </div>

    `;

    chatBox.scrollTop = chatBox.scrollHeight;

  });

  alert("Private Room Joined");

}

window.sendMessage = function(){

  let username = document.getElementById("username").value;
  let message = document.getElementById("message").value;

  if(currentRoom === ""){
    alert("Join Room First");
    return;
  }

  if(username === "" || message === ""){
    alert("Fill all fields");
    return;
  }

  const msgRef = push(ref(db,"privateRooms/" + currentRoom));

  set(msgRef,{
    username:username,
    message:message,
    time:new Date().toLocaleString()
  });

  document.getElementById("message").value = "";

}

</script>

</body>
</html>
