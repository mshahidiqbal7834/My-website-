<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Private Admin Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:#fff;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-screen{
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.login-card{
width:100%;
max-width:400px;
background:#0f172a;
padding:30px;
border-radius:20px;
border:1px solid #1e293b;
text-align:center;
}

.login-card h1{
margin-bottom:15px;
}

.login-card p{
color:#94a3b8;
margin-bottom:20px;
line-height:1.6;
}

.google-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:#fff;
font-size:16px;
cursor:pointer;
}

.container{
display:none;
flex-direction:column;
width:100%;
max-width:900px;
height:95vh;
background:#0f172a;
border-radius:20px;
overflow:hidden;
border:1px solid #1e293b;
}

.top{
background:#111827;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1e293b;
}

.user{
display:flex;
align-items:center;
gap:12px;
}

.user img{
width:50px;
height:50px;
border-radius:50%;
}

.logout-btn{
padding:12px 16px;
background:#dc2626;
border:none;
border-radius:12px;
color:#fff;
cursor:pointer;
}

.room{
padding:15px;
display:flex;
gap:10px;
background:#0b1220;
border-bottom:1px solid #1e293b;
}

.room input{
flex:1;
padding:14px;
border:none;
border-radius:12px;
background:#1e293b;
color:#fff;
outline:none;
}

.room button{
padding:14px 18px;
border:none;
border-radius:12px;
background:#2563eb;
color:#fff;
cursor:pointer;
}

.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
background:#0f172a;
}

.msg-row{
display:flex;
margin-bottom:15px;
}

.mine{
justify-content:flex-end;
}

.msg{
max-width:80%;
background:#1e293b;
padding:12px;
border-radius:18px;
}

.mine .msg{
background:#1d4ed8;
}

.msg-top{
display:flex;
align-items:center;
gap:10px;
margin-bottom:8px;
}

.msg-top img{
width:40px;
height:40px;
border-radius:50%;
}

.text{
white-space:pre-wrap;
word-break:break-word;
line-height:1.5;
}

.time{
display:block;
margin-top:8px;
font-size:12px;
opacity:.8;
}

.bottom{
padding:15px;
display:flex;
gap:10px;
background:#111827;
border-top:1px solid #1e293b;
}

.bottom input{
flex:1;
padding:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:#fff;
outline:none;
}

.bottom button{
padding:15px 18px;
border:none;
border-radius:12px;
background:#2563eb;
color:#fff;
cursor:pointer;
}

</style>
</head>
<body>

<div class="login-screen" id="loginScreen">

<div class="login-card">

<h1>Private Admin Chat</h1>

<p>
Sirf admin Gmail login kar sakta hai.
</p>

<button class="google-btn" id="loginBtn">
Login With Google
</button>

</div>

</div>

<div class="container" id="app">

<div class="top">

<div class="user">

<img id="myPhoto">

<div>
<h3 id="myName">Admin</h3>
<small id="myEmail"></small>
</div>

</div>

<button class="logout-btn" id="logoutBtn">
Logout
</button>

</div>

<div class="room">

<input
type="email"
id="otherEmail"
placeholder="Enter other Gmail"
/>

<button id="openBtn">
Open Private
</button>

</div>

<div class="chat-box" id="chatBox">

</div>

<div class="bottom">

<input
type="text"
id="messageInput"
placeholder="Write message..."
>

<button id="sendBtn">
Send
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDpERmy9jWQ5IS5GmyP54EZNdYDiKB-3RI",

authDomain: "wadi-soon-site.firebaseapp.com",

projectId: "wadi-soon-site",

storageBucket: "wadi-soon-site.firebasestorage.app",

messagingSenderId: "306902521128",

appId: "1:306902521128:web:13b34b479048240b96ec1d",

measurementId: "G-HX8J4GC9SQ"

};

const ADMIN_EMAIL = "mshahidiqbal836@gmail.com";

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();

const loginScreen =
document.getElementById("loginScreen");

const appBox =
document.getElementById("app");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const myPhoto =
document.getElementById("myPhoto");

const myName =
document.getElementById("myName");

const myEmail =
document.getElementById("myEmail");

const otherEmail =
document.getElementById("otherEmail");

const openBtn =
document.getElementById("openBtn");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const chatBox =
document.getElementById("chatBox");

let currentUser = null;

let currentRoom = null;

loginBtn.onclick = async ()=>{

try{

await signInWithPopup(auth,provider);

}catch(e){

alert("Login Error");

console.log(e);

}

};

logoutBtn.onclick = async ()=>{

await signOut(auth);

location.reload();

};

onAuthStateChanged(auth, async(user)=>{

if(user){

if(user.email !== ADMIN_EMAIL){

alert("Only Admin Allowed");

await signOut(auth);

return;

}

currentUser = user;

loginScreen.style.display = "none";

appBox.style.display = "flex";

myPhoto.src = user.photoURL;

myName.innerText = user.displayName;

myEmail.innerText = user.email;

}else{

loginScreen.style.display = "flex";

appBox.style.display = "none";

}

});

openBtn.onclick = ()=>{

const other = otherEmail.value.trim();

if(!other){

alert("Enter Gmail");

return;

}

currentRoom =
[currentUser.email,other]
.sort()
.join("_")
.replace(/[.#$[\]]/g,"_");

loadMessages();

};

async function sendMessage(){

const text = messageInput.value.trim();

if(!text) return;

if(!currentRoom){

alert("Open Private Chat First");

return;

}

await addDoc(
collection(db,"rooms",currentRoom,"messages"),
{

text:text,

sender:currentUser.email,

name:currentUser.displayName,

photo:currentUser.photoURL,

createdAt:serverTimestamp(),

time:Date.now()

}

);

messageInput.value = "";

}

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){

sendMessage();

}

});

function loadMessages(){

const q = query(

collection(db,"rooms",currentRoom,"messages"),

orderBy("time","asc")

);

onSnapshot(q,(snapshot)=>{

chatBox.innerHTML = "";

snapshot.forEach((doc)=>{

const data = doc.data();

const mine =
data.sender === currentUser.email;

chatBox.innerHTML += `

<div class="msg-row ${mine ? "mine" : ""}">

<div class="msg">

<div class="msg-top">

<img src="${data.photo}">

<div>

<b>${data.name}</b><br>

<small>${data.sender}</small>

</div>

</div>

<div class="text">

${data.text}

</div>

<small class="time">

${new Date(data.time).toLocaleString()}

</small>

</div>

</div>

`;

});

chatBox.scrollTop =
chatBox.scrollHeight;

});

}

</script>

</body>
</html>
