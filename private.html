<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Future Private Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
height:100vh;
overflow:hidden;
}

/* LOGIN */

.login-screen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#020617,#0f172a,#1e293b);
z-index:999;
}

.login-card{
width:100%;
max-width:420px;
padding:35px;
border-radius:25px;
background:rgba(15,23,42,.95);
border:1px solid #334155;
backdrop-filter:blur(20px);
text-align:center;
box-shadow:
0 0 40px rgba(37,99,235,.4);
}

.login-card h1{
font-size:35px;
margin-bottom:15px;
background:linear-gradient(to right,#60a5fa,#2563eb);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.login-card p{
line-height:1.7;
color:#94a3b8;
margin-bottom:25px;
}

.google-btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;
}

.google-btn:hover{
transform:translateY(-3px);
background:#1d4ed8;
}

/* APP */

.app{
display:none;
height:100vh;
grid-template-columns:320px 1fr;
}

/* SIDEBAR */

.sidebar{
background:#0f172a;
border-right:1px solid #1e293b;
display:flex;
flex-direction:column;
}

.profile{
padding:20px;
border-bottom:1px solid #1e293b;
text-align:center;
}

.profile img{
width:90px;
height:90px;
border-radius:50%;
border:3px solid #2563eb;
object-fit:cover;
margin-bottom:12px;
}

.profile h2{
font-size:22px;
margin-bottom:5px;
}

.profile small{
color:#94a3b8;
word-break:break-word;
}

.sidebar-menu{
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.sidebar-menu button{
padding:14px;
border:none;
border-radius:14px;
background:#1e293b;
color:white;
cursor:pointer;
transition:.3s;
font-size:15px;
}

.sidebar-menu button:hover{
background:#2563eb;
transform:translateX(4px);
}

/* CHAT AREA */

.chat-area{
display:flex;
flex-direction:column;
height:100vh;
}

/* TOPBAR */

.topbar{
padding:18px 20px;
background:#0f172a;
border-bottom:1px solid #1e293b;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.room-box{
display:flex;
gap:10px;
flex:1;
}

.room-box input{
flex:1;
padding:14px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
outline:none;
}

.room-box button{
padding:14px 18px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
}

/* CHAT */

.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
background:
radial-gradient(circle at top,#0f172a,#020617);
}

.empty{
text-align:center;
margin-top:100px;
color:#64748b;
line-height:1.8;
}

.msg-row{
display:flex;
margin-bottom:16px;
}

.mine{
justify-content:flex-end;
}

.message{
max-width:78%;
padding:14px;
border-radius:20px;
background:#1e293b;
border:1px solid rgba(255,255,255,.05);
animation:fade .3s ease;
}

.mine .message{
background:#1d4ed8;
}

.msg-top{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.msg-top img{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
}

.msg-info{
flex:1;
min-width:0;
}

.msg-info b,
.msg-info small{
display:block;
word-break:break-word;
}

.msg-info small{
color:#cbd5e1;
margin-top:3px;
}

.msg-text{
line-height:1.7;
white-space:pre-wrap;
word-break:break-word;
}

.time{
display:block;
margin-top:10px;
font-size:12px;
opacity:.8;
}

.action-btns{
display:flex;
gap:8px;
margin-top:12px;
flex-wrap:wrap;
}

.delete-btn{
padding:8px 10px;
border:none;
border-radius:10px;
background:#dc2626;
color:white;
cursor:pointer;
font-size:12px;
}

.edit-btn{
padding:8px 10px;
border:none;
border-radius:10px;
background:#f59e0b;
color:white;
cursor:pointer;
font-size:12px;
}

/* BOTTOM */

.bottom{
padding:18px;
background:#0f172a;
border-top:1px solid #1e293b;
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

.bottom input{
flex:1;
padding:16px;
border:none;
border-radius:14px;
background:#1e293b;
color:white;
outline:none;
min-width:200px;
}

.bottom button{
padding:16px 18px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
cursor:pointer;
}

.recording{
background:#dc2626 !important;
animation:pulse 1s infinite;
}

.status{
width:100%;
font-size:13px;
color:#93c5fd;
margin-top:5px;
}

/* AUDIO */

audio{
width:100%;
margin-top:10px;
border-radius:12px;
}

/* ADMIN */

.admin-panel{
position:fixed;
top:20px;
right:20px;
width:320px;
background:#0f172a;
border:1px solid #334155;
border-radius:20px;
padding:20px;
display:none;
z-index:100;
box-shadow:0 0 30px rgba(0,0,0,.4);
}

.admin-panel h2{
margin-bottom:15px;
}

.admin-panel textarea{
width:100%;
height:100px;
background:#1e293b;
border:none;
border-radius:12px;
padding:12px;
color:white;
resize:none;
margin-bottom:12px;
}

.admin-panel button{
width:100%;
margin-top:10px;
}

/* ANNOUNCEMENT */

.announcement{
padding:12px 20px;
background:#1d4ed8;
text-align:center;
font-size:14px;
display:none;
}

/* ANIMATION */

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.03)}
100%{transform:scale(1)}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* MOBILE */

@media(max-width:900px){

.app{
grid-template-columns:1fr;
}

.sidebar{
display:none;
}

.message{
max-width:92%;
}

}

</style>
</head>

<body>

<div class="login-screen" id="loginScreen">

<div class="login-card">

<h1>Future Chat</h1>

<p>
Realtime Firebase AI Style Private Chat System
with Voice Notes, Delete, Admin Panel,
Announcements and Modern UI.
</p>

<button class="google-btn" id="loginBtn">
Login With Google
</button>

</div>

</div>

<div class="announcement" id="announcementBar">
No announcement
</div>

<div class="admin-panel" id="adminPanel">

<h2>Admin Panel</h2>

<textarea
id="announcementInput"
placeholder="Write announcement..."
></textarea>

<button id="postAnnouncementBtn">
Post Announcement
</button>

<button id="clearMessagesBtn">
Delete All Messages
</button>

</div>

<div class="app" id="app">

<div class="sidebar">

<div class="profile">

<img id="myPhoto">

<h2 id="myName">
User
</h2>

<small id="myEmail">
user@gmail.com
</small>

</div>

<div class="sidebar-menu">

<button onclick="toggleAdminPanel()">
Admin Panel
</button>

<button onclick="logout()">
Logout
</button>

</div>

</div>

<div class="chat-area">

<div class="topbar">

<div class="room-box">

<input
type="email"
id="otherEmail"
placeholder="Enter other Gmail"
/>

<button id="openRoomBtn">
Open Private
</button>

</div>

</div>

<div class="chat-box" id="chatBox">

<div class="empty">
Open private room and start chatting.
</div>

</div>

<div class="bottom">

<input
type="text"
id="messageInput"
placeholder="Write message..."
>

<button id="recordBtn">
🎤
</button>

<button id="sendBtn">
Send
</button>

<div class="status" id="statusText">
Ready
</div>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
deleteDoc,
doc,
updateDoc,
serverTimestamp,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyDpERmy9jWQ5IS5GmyP54EZNdYDiKB-3RI",

authDomain:"wadi-soon-site.firebaseapp.com",

projectId:"wadi-soon-site",

storageBucket:"wadi-soon-site.firebasestorage.app",

messagingSenderId:"306902521128",

appId:"1:306902521128:web:13b34b479048240b96ec1d"

};

const ADMIN_EMAIL =
"mshahidiqbal836@gmail.com";

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const provider =
new GoogleAuthProvider();

const loginScreen =
document.getElementById("loginScreen");

const appBox =
document.getElementById("app");

const loginBtn =
document.getElementById("loginBtn");

const myPhoto =
document.getElementById("myPhoto");

const myName =
document.getElementById("myName");

const myEmail =
document.getElementById("myEmail");

const otherEmail =
document.getElementById("otherEmail");

const openRoomBtn =
document.getElementById("openRoomBtn");

const chatBox =
document.getElementById("chatBox");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const recordBtn =
document.getElementById("recordBtn");

const statusText =
document.getElementById("statusText");

const adminPanel =
document.getElementById("adminPanel");

const announcementInput =
document.getElementById("announcementInput");

const announcementBar =
document.getElementById("announcementBar");

let currentUser = null;

let currentRoom = null;

let mediaRecorder = null;

let audioChunks = [];

function setStatus(text){
statusText.innerText = text;
}

function safeEmail(email=""){
return email
.trim()
.toLowerCase()
.replace(/[.#$[\]]/g,"_");
}

function roomId(a,b){
return [a,b]
.sort()
.join("_");
}

loginBtn.onclick = async()=>{

try{

await signInWithPopup(auth,provider);

}catch(e){

alert("Login Error");

console.log(e);

}

};

onAuthStateChanged(auth,(user)=>{

if(user){

currentUser = user;

loginScreen.style.display = "none";

appBox.style.display = "grid";

myPhoto.src =
user.photoURL ||
"https://via.placeholder.com/80";

myName.innerText =
user.displayName;

myEmail.innerText =
user.email;

if(user.email === ADMIN_EMAIL){

adminPanel.style.display = "block";

}

loadAnnouncements();

}else{

loginScreen.style.display = "flex";

appBox.style.display = "none";

}

});

window.logout = async()=>{

await signOut(auth);

location.reload();

};

window.toggleAdminPanel = ()=>{

if(adminPanel.style.display === "none"){

adminPanel.style.display = "block";

}else{

adminPanel.style.display = "none";

}

};

openRoomBtn.onclick = ()=>{

const other =
otherEmail.value.trim();

if(other === ""){

alert("Enter Gmail");

return;

}

currentRoom =
roomId(
safeEmail(currentUser.email),
safeEmail(other)
);

loadMessages();

setStatus("Private room opened");

};

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown",(e)=>{

if(e.key === "Enter"){

sendMessage();

}

});

async function sendMessage(){

const text =
messageInput.value.trim();

if(text === "") return;

if(!currentRoom){

alert("Open room first");

return;

}

await addDoc(
collection(db,"rooms",currentRoom,"messages"),
{

type:"text",

text:text,

name:currentUser.displayName,

email:currentUser.email,

photo:currentUser.photoURL || "",

time:Date.now(),

createdAt:serverTimestamp()

}

);

messageInput.value = "";

setStatus("Message Sent");

}

function loadMessages(){

const q = query(

collection(
db,
"rooms",
currentRoom,
"messages"
),

orderBy("time","asc")

);

onSnapshot(q,(snapshot)=>{

chatBox.innerHTML = "";

if(snapshot.empty){

chatBox.innerHTML = `
<div class="empty">
No messages yet.
</div>
`;

return;

}

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

const mine =
data.email === currentUser.email;

chatBox.innerHTML += `

<div class="msg-row ${mine ? "mine" : ""}">

<div class="message">

<div class="msg-top">

<img src="${
data.photo ||
'https://via.placeholder.com/40'
}">

<div class="msg-info">

<b>${data.name}</b>

<small>${data.email}</small>

</div>

</div>

${
data.type === "text"
?
`<div class="msg-text">
${data.text}
</div>`
:
`<audio controls src="${data.audio}">
</audio>`
}

<small class="time">
${new Date(data.time).toLocaleString()}
</small>

<div class="action-btns">

<button
class="delete-btn"
onclick="deleteMessage('${docSnap.id}')"
>
Delete
</button>

<button
class="edit-btn"
onclick="editMessage(
'${docSnap.id}',
\`${data.text || ""}\`
)"
>
Edit
</button>

</div>

</div>

</div>

`;

});

chatBox.scrollTop =
chatBox.scrollHeight;

});

}

window.deleteMessage = async(id)=>{

if(!currentRoom) return;

await deleteDoc(

doc(
db,
"rooms",
currentRoom,
"messages",
id
)

);

};

window.editMessage = async(id,oldText)=>{

const newText =
prompt("Edit Message",oldText);

if(!newText) return;

await updateDoc(

doc(
db,
"rooms",
currentRoom,
"messages",
id
),

{
text:newText
}

);

};

recordBtn.onclick = async()=>{

if(!currentRoom){

alert("Open room first");

return;

}

if(
!mediaRecorder ||
mediaRecorder.state === "inactive"
){

startRecording();

}else{

stopRecording();

}

};

async function startRecording(){

const stream =
await navigator.mediaDevices
.getUserMedia({audio:true});

mediaRecorder =
new MediaRecorder(stream);

audioChunks = [];

mediaRecorder.ondataavailable = e=>{

audioChunks.push(e.data);

};

mediaRecorder.onstop = async()=>{

const blob =
new Blob(audioChunks,{
type:"audio/webm"
});

const reader =
new FileReader();

reader.onloadend = async()=>{

await addDoc(
collection(
db,
"rooms",
currentRoom,
"messages"
),
{

type:"audio",

audio:reader.result,

name:currentUser.displayName,

email:currentUser.email,

photo:currentUser.photoURL || "",

time:Date.now()

}

);

};

reader.readAsDataURL(blob);

};

mediaRecorder.start();

recordBtn.classList.add("recording");

recordBtn.innerText = "⏹";

setStatus("Recording...");

}

function stopRecording(){

mediaRecorder.stop();

recordBtn.classList.remove("recording");

recordBtn.innerText = "🎤";

setStatus("Voice Note Sent");

}

document
.getElementById("postAnnouncementBtn")
.onclick = async()=>{

if(
currentUser.email !== ADMIN_EMAIL
){

return;

}

const text =
announcementInput.value.trim();

if(text === "") return;

await addDoc(
collection(db,"announcements"),
{

text:text,

time:Date.now()

}

);

announcementInput.value = "";

alert("Announcement Posted");

};

function loadAnnouncements(){

const q = query(

collection(db,"announcements"),

orderBy("time","desc")

);

onSnapshot(q,(snapshot)=>{

if(snapshot.empty) return;

const data =
snapshot.docs[0].data();

announcementBar.style.display =
"block";

announcementBar.innerText =
data.text;

});

}

document
.getElementById("clearMessagesBtn")
.onclick = async()=>{

if(
currentUser.email !== ADMIN_EMAIL
){

return;

}

const ok =
confirm("Delete all messages?");

if(!ok) return;

const rooms =
await getDocs(
collection(db,"rooms")
);

for(const room of rooms.docs){

const msgs =
await getDocs(
collection(
db,
"rooms",
room.id,
"messages"
)
);

for(const msg of msgs.docs){

await deleteDoc(msg.ref);

}

}

alert("All Messages Deleted");

};

</script>

</body>
</html>
