<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Inbox</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#020617;
font-family:Arial;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:100%;
max-width:900px;
height:95vh;
background:#0f172a;
border-radius:25px;
overflow:hidden;
box-shadow:0 0 30px rgba(0,0,0,0.4);
display:flex;
flex-direction:column;
}

.top{
background:#1e293b;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
}

.profile{
display:flex;
align-items:center;
gap:12px;
}

.profile img{
width:55px;
height:55px;
border-radius:50%;
}

.menu button{
width:45px;
height:45px;
border:none;
border-radius:50%;
background:#2563eb;
color:white;
font-size:20px;
cursor:pointer;
}

.chat-box{
flex:1;
padding:20px;
overflow-y:auto;
}

.message{
background:#1e293b;
padding:15px;
border-radius:18px;
margin-bottom:15px;
}

.message img{
width:40px;
height:40px;
border-radius:50%;
margin-bottom:10px;
}

.bottom{
padding:15px;
background:#1e293b;
display:flex;
gap:10px;
}

input{
flex:1;
padding:15px;
border:none;
border-radius:12px;
background:#334155;
color:white;
}

button{
padding:15px 22px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
}

.login-screen{
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
gap:20px;
z-index:999;
}

.login-screen button{
width:250px;
}

</style>
</head>

<body>

<div class="login-screen" id="loginScreen">
<h1>Private Chat Login</h1>
<button onclick="googleLogin()">
Login With Google
</button>
</div>

<div class="container">

<div class="top">

<div class="profile">
<img id="userPhoto">
<div>
<h3 id="userName"></h3>
<small id="userEmail"></small>
</div>
</div>

<div class="menu">
<button onclick="logout()">⎋</button>
</div>

</div>

<div class="chat-box" id="chatBox"></div>

<div class="bottom">
<input type="text" id="message" placeholder="Write message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
getDatabase,
ref,
push,
set,
onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyDpERmy9jWQ5IS5GmyP54EZNdYDiKB-3RI",
authDomain: "wadi-soon-site.firebaseapp.com",
projectId: "wadi-soon-site",
storageBucket: "wadi-soon-site.firebasestorage.app",
messagingSenderId: "306902521128",
appId: "1:306902521128:web:13b34b479048240b96ec1d",
measurementId: "G-HX8J4GC9SQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

let currentUser;

window.googleLogin = function(){

signInWithPopup(auth,provider);

}

onAuthStateChanged(auth,(user)=>{

if(user){

currentUser = user;

document.getElementById("loginScreen").style.display = "none";

document.getElementById("userName").innerText = user.displayName;
document.getElementById("userEmail").innerText = user.email;
document.getElementById("userPhoto").src = user.photoURL;

loadMessages();

}

});

window.sendMessage = function(){

let msg = document.getElementById("message").value;

if(msg === "") return;

const chatRef = push(ref(db,"privateMessages/" + currentUser.uid));

set(chatRef,{
name:currentUser.displayName,
email:currentUser.email,
photo:currentUser.photoURL,
message:msg,
time:new Date().toLocaleString()
});

document.getElementById("message").value = "";

}

function loadMessages(){

onChildAdded(ref(db,"privateMessages/" + currentUser.uid),(snapshot)=>{

let data = snapshot.val();

chatBox.innerHTML += `
<div class="message">
<img src="${data.photo}">
<b>${data.name}</b><br><br>
${data.message}<br><br>
<small>${data.time}</small>
</div>
`;

chatBox.scrollTop = chatBox.scrollHeight;

});

}

window.logout = function(){

signOut(auth);
location.reload();

}

</script>

</body>
</html>
