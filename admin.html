<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f172a;
  font-family:Arial,sans-serif;
  color:white;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.card h2{
  margin-bottom:15px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-size:15px;
  margin-top:10px;
}

button:hover{
  background:#1d4ed8;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  background:#334155;
  color:white;
}

.message-box{
  background:#334155;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.logout-btn{
  background:#dc2626;
}

</style>
</head>

<body>

<div class="container">

<h1>Admin Panel</h1>

<div class="card">
<h2>Admin Info</h2>
<div id="adminInfo">Checking admin...</div>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="card">

<h2>Announcement</h2>

<input type="text"
id="announcement"
placeholder="Write announcement...">

<button onclick="sendAnnouncement()">
Post Announcement
</button>

</div>

<div class="card">

<h2>Chat Controls</h2>

<button onclick="clearChat()">
Clear All Messages
</button>

</div>

<div class="card">

<h2>Recent Messages</h2>

<div id="messagesContainer">
Loading messages...
</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  query,
  orderBy,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyDpERmy9jWQ5IS5GmyP54EZNdYDiKB-3RI",

  authDomain: "wadi-soon-site.firebaseapp.com",

  projectId: "wadi-soon-site",

  storageBucket: "wadi-soon-site.firebasestorage.app",

  messagingSenderId: "306902521128",

  appId: "1:306902521128:web:13b34b479048240b96ec1d",

  measurementId: "G-HX8J4GC9SQ"

};

const ADMIN_EMAIL = "mshahidiqbal836@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const adminInfo = document.getElementById("adminInfo");
const messagesContainer = document.getElementById("messagesContainer");

let currentUser = null;

onAuthStateChanged(auth, async(user)=>{

  if(!user){

    try{
      await signInWithPopup(auth,provider);
    }catch(e){
      alert("Login error");
    }

    return;
  }

  currentUser = user;

  if(user.email !== ADMIN_EMAIL){
    alert("Access denied");
    location.href = "index.html";
    return;
  }

  adminInfo.innerHTML = `
    <b>${user.displayName}</b><br>
    ${user.email}
  `;

  loadMessages();

});

window.logout = async function(){
  await signOut(auth);
  location.reload();
}

window.sendAnnouncement = async function(){

  let text =
  document.getElementById("announcement").value;

  if(text === ""){
    alert("Write something");
    return;
  }

  await addDoc(collection(db,"announcements"),{
    text:text,
    time:new Date().toLocaleString(),
    createdAt:Date.now()
  });

  alert("Announcement Posted");

  document.getElementById("announcement").value = "";

}

window.clearChat = async function(){

  const ok = confirm("Delete all messages?");

  if(!ok) return;

  const rooms = await getDocs(collection(db,"rooms"));

  for(const room of rooms.docs){

    const msgs =
    await getDocs(collection(db,"rooms",room.id,"messages"));

    for(const msg of msgs.docs){
      await deleteDoc(msg.ref);
    }
  }

  alert("All messages deleted");

}

async function loadMessages(){

  const rooms = await getDocs(collection(db,"rooms"));

  let html = "";

  for(const room of rooms.docs){

    const q = query(
      collection(db,"rooms",room.id,"messages"),
      orderBy("createdAtMs","desc")
    );

    onSnapshot(q,(snapshot)=>{

      html = "";

      snapshot.forEach((docSnap)=>{

        const data = docSnap.data();

        html += `
          <div class="message-box">
            <b>${data.name || "User"}</b><br>
            ${data.senderEmail || ""}<br><br>
            ${data.text || "Voice Message"}
          </div>
        `;

      });

      if(html === ""){
        html = "No messages";
      }

      messagesContainer.innerHTML = html;

    });

  }

}

</script>

</body>
</html>
